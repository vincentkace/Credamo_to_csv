[package]
name = "credamo-downloader"
version = "0.1.0"
description = "Credamo Data Downloader"
authors = ["you"]
edition = "2021"

[lib]
name = "credamo_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
csv = "1.3"
dirs = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
